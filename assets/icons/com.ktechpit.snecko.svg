<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5a41"/>
      <stop offset="1" stop-color="#1c3a2b"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe36b"/>
      <stop offset="1" stop-color="#1f9c86"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- coiled snake body -->
  <path d="M64 176
           C 64 120, 112 108, 148 128
           C 180 146, 168 190, 128 190
           C 96 190, 92 160, 118 152"
        fill="none" stroke="url(#snake)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- head -->
  <g transform="translate(150 92) rotate(20)">
    <rect x="-30" y="-28" width="60" height="56" rx="26" fill="#8fe36b"/>
    <!-- eyes -->
    <circle cx="8"  cy="-12" r="13" fill="#fff6cf"/>
    <circle cx="8"  cy="14"  r="13" fill="#fff6cf"/>
    <circle cx="13" cy="-11" r="6"  fill="#20321f"/>
    <circle cx="13" cy="15"  r="6"  fill="#20321f"/>
  </g>

  <!-- apple -->
  <circle cx="86" cy="92" r="20" fill="#e23b2c"/>
  <rect x="84" y="66" width="4" height="12" rx="2" fill="#7a4a25"/>
  <ellipse cx="98" cy="70" rx="11" ry="6" transform="rotate(-28 98 70)" fill="#57b845"/>
</svg>
