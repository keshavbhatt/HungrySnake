name: hungrysnake
adopt-info: hungrysnake
license: GPL-3.0-or-later # the licensing module has its own licence: LICENSING.md

grade: stable
confinement: strict
base: core24
compression: lzo

icon: snap/gui/icon.png

platforms:
  amd64:
  arm64:

apps:
  hungrysnake:
    command: usr/bin/hungrysnake
    desktop: usr/share/applications/com.ktechpit.hungrysnake.desktop
    common-id: com.ktechpit.hungrysnake
    extensions:
      - kde-neon-6
    environment:
      IS_SNAP: '1'
    plugs:
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - audio-playback
      - alsa
      - network

parts:
  hungrysnake:
    source: .
    plugin: cmake
    parse-info:
      - usr/share/metainfo/com.ktechpit.hungrysnake.metainfo.xml
    build-packages:
      - libxkbcommon-dev
      - libpulse-dev
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    override-build: |
      craftctl default
      sed -i \
        "s|^Icon=.*|Icon=\${SNAP}/meta/gui/icon.png|" \
        ${CRAFT_PART_INSTALL}/usr/share/applications/com.ktechpit.hungrysnake.desktop
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/man
      - -usr/share/lintian
