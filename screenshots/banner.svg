<?xml version="1.0" encoding="UTF-8"?>
<svg width="2400" height="800" viewBox="0 0 2400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245c44"/>
      <stop offset="1" stop-color="#0d251b"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e5a41"/>
      <stop offset="1" stop-color="#0f3527"/>
    </linearGradient>
    <clipPath id="head"><rect x="118" y="86" width="272" height="286" rx="90"/></clipPath>

    <!-- the game's checkerboard, abstracted into a faint texture -->
    <pattern id="checker" width="240" height="240" patternUnits="userSpaceOnUse">
      <rect x="8"   y="8"   width="104" height="104" rx="24" fill="#9fe0b4"/>
      <rect x="128" y="128" width="104" height="104" rx="24" fill="#9fe0b4"/>
    </pattern>
    <!-- fade the board in from the left so it never crowds the wordmark -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#000000"/>
      <stop offset="0.72" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="boardMask">
      <rect width="2400" height="800" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="2400" height="800" fill="url(#bg)"/>

  <!-- faint checkerboard field, fading in on the right -->
  <g mask="url(#boardMask)" opacity="0.075">
    <rect x="1140" y="-60" width="1320" height="920" fill="url(#checker)"/>
  </g>

  <!-- a red apple resting on the board, below the head, clear of the text -->
  <g transform="translate(1560 632)">
    <path d="M2 -46 q14 -20 40 -9 q-8 -24 -36 -16" fill="#57b845"/>
    <circle cx="0" cy="6" r="46" fill="#e23b2c"/>
    <ellipse cx="-16" cy="-8" rx="13" ry="18" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- app icon: jungle snake head with googly eyes -->
  <g transform="translate(1770 190)">
    <rect x="0" y="0" width="420" height="420" rx="108" fill="url(#tile)"/>
    <rect x="118" y="86" width="272" height="286" rx="90" fill="#2fb268"/>
    <rect x="118" y="86" width="272" height="122" rx="61" fill="#1f8f56"/>
    <rect x="254" y="86" width="136" height="286" fill="#000000" opacity="0.13" clip-path="url(#head)"/>
    <path d="M 190 282 Q 254 340 318 272" stroke="#14603f" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="322" cy="310" r="20" fill="#e63a3a"/>
    <circle cx="176" cy="182" r="66" fill="#ffffff"/>
    <circle cx="294" cy="171" r="50" fill="#ffffff"/>
    <circle cx="190" cy="189" r="27" fill="#14603f"/>
    <circle cx="304" cy="176" r="21" fill="#14603f"/>
    <circle cx="199" cy="179" r="9" fill="#ffffff"/>
    <circle cx="311" cy="168" r="8" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="180" y="358" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="156"
        font-weight="800" fill="#8fe0a4">Hungry Snake</text>
  <text x="186" y="452" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="58"
        font-weight="600" fill="#f0c23a">A juicy, jungle-themed take on classic Snake</text>
  <text x="186" y="540" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="44"
        font-weight="400" fill="#bcd8c4">Eat apples and grow long, just don't bite your own tail.</text>
</svg>
