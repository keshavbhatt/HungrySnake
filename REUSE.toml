version = 1
SPDX-PackageName = "Hungry Snake"
SPDX-PackageSupplier = "Keshav Bhatt <connect@ktechpit.com>"
SPDX-PackageDownloadLocation = "https://github.com/keshavbhatt/HungrySnake"

# Everything is GPL-3.0-or-later except the fonts and the licensing module below.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled typefaces: SIL Open Font License, their own copyright holders.
[[annotations]]
path = ["assets/fonts/Fredoka.ttf", "assets/fonts/Fredoka-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Fredoka Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/TitanOne.ttf", "assets/fonts/TitanOne-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2011 Rodrigo Fuenzalida"
SPDX-License-Identifier = "OFL-1.1"

# The licensing module: account, licence and Supporter Pack verification code.
[[annotations]]
path = [
    "modules/AccountAndLicense/**",
    "src/licensing/**"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "LicenseRef-Ktechpit-Licensing-Module"
